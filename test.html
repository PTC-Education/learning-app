<html>
    <head>
        <style>
            table.item_summary {
                color: #333;
                font-family: Flama,Open Sans,Helvetica Neue,Helvetica,Arial,sans-serif;
                border-collapse: collapse;
            }
            .item_summary thead, .item_summary tbody {
               border: 1px solid #d3d7d9;
            }
            .item_summary thead {
               font-weight: 700;
               background-color: #f5f5f5;
            }
            .item_summary td {
                font-weight: 400;
            }
            .item_summary td, .item_summary th {
                font-size: 9pt;   
                line-height: 1.8em;
                text-align: left;
                padding: 0.5em 3em 0.5em 0.5em;
                border-left: 1px solid #d3d7d9;
            }
            .item_summary tbody tr:hover {
                background-color: #e2f0fa !important;
            }
            .item_summary tbody tr:nth-child(odd) {
                background-color: #fafafa;
            }
            /* == Radio button styling == */
            .element_container {
                color: #333;
                font-family: Flama,Open Sans,Helvetica Neue,Helvetica,Arial,sans-serif;
                display: block;
                position: relative;
                padding-left: 35px;
                padding-top: 6px;
                margin-bottom: 10px;
                cursor: pointer;
                font-size: 12px;
                -webkit-user-select: none;
                -moz-user-select: none;
                -ms-user-select: none;
                user-select: none;
            }

            /* Hide the browser's default radio button */
            .element_container input {
                position: absolute;
                opacity: 0;
                cursor: pointer;
            }

            /* Create a custom radio button */
            .checkmark {
                position: absolute;
                top: 0;
                left: 0;
                height: 25px;
                width: 25px;
                background-color: #eee;
                /* border-radius: 50%; */
            }

            /* On mouse-over, add a grey background color */
            .element_container:hover input ~ .checkmark {
                background-color: #ccc;
            }

            /* When the radio button is checked, add a green background */
            .element_container input:checked ~ .checkmark {
                background-color: #40AA1D;
            }

            /* Create the indicator */
            .checkmark:after {
                content: "";
                position: absolute;
                display: none;
            }

            /* Show the indicator when checked */
            .element_container input:checked ~ .checkmark:after {
                display: block;
            }

            /* Style the indicator */
            .element_container .checkmark:after {
                top: 9px;
                left: 9px;
                width: 8px;
                height: 8px;
                /* border-radius: 50%; */
                background: #ccc;
            }
            /* == End radio button styling == */
        </style>
    </head>
    <body>
        <!-- Radio Buttons -->
        <label class="element_container">One
            <input type="radio" checked="checked" name="radio">
            <span class="checkmark"></span>
          </label>
          <label class="element_container">Two
            <input type="radio" name="radio">
            <span class="checkmark"></span>
          </label>
          <label class="element_container">Three
            <input type="radio" name="radio">
            <span class="checkmark"></span>
          </label>
          <label class="element_container">Four
            <input type="radio" name="radio">
            <span class="checkmark"></span>
        </label>

        <!-- Table -->
        <table class="item_summary">
            <thead>
                <tr><th>Tab</th><th>Count</th></tr>
            </thead>
            <tbody>
                <tr><td>Assemblies</td><td>3</td></tr>
                <tr><td>Part Studios</td><td>2</td></tr>
                <tr><td>Drawings</td><td>0</td></tr>
                <tr><td>Other tabs</td><td>0</td></tr>
            </tbody>
        </table>
</html>
