<!DOCTYPE html>
<html lang="en-US">
    <head>
        {% load static %}
        <link rel="stylesheet" href="{% static 'grader/index.css' %}">
        <!-- Load js for filenames -->
        <script src="{% static 'grader/filename.js' %}" type="text/javascript" defer></script>
        <!-- Load js for documentnames -->
        <script src="{% static 'grader/showlist.js' %}" type="text/javascript" defer></script>
        <!-- Load js for handling export of csv -->
        <script src="{% static 'grader/download_csv.js' %}" type="text/javascript" defer></script>
        <!-- Load loading_modelling function to enable loading screen -->
        <script src="{% static 'grader/loading.js' %}" type="text/javascript"></script>



    </head>
    <body>
        <!-- Return to the home page -->
        <br />
        <form action="{% url 'grader:index' user.os_user_id %}">
            <input type="submit" value="Return to Home Page"/>
        </form>
        <br />
        
        <!-- Render the HTML from the markdown file-->
        {% if error_message %}
        <p id="err_msg"><strong>{{ error_message }}</strong></p>
        {% endif %}
        <!-- Render the HTML from the markdown file-->
        {% if classes %}
        {% for class in classes %}
            <input type="text" name="filename" id="fname" value={{class.0|safe}}  title="Copy/paste reference model" size="50" /> <!--Names of classes-->
            <input type="text" name="filename" id="fname" value={{class.1|safe}}  title="Copy/paste reference model" size="50" /> <!--Assignments in the classes - need to to be exposed with a dropdown arrow  -->
      
         {% endfor %}
         {% endif %}
       {% if blobs %}
        {% for blob in blobs %}
            <input type="text" name="filename" id="fname" value={{blob.0|safe}}  title="Copy/paste reference model" size="50" /> <!--Name of the markdown files-->
            <input type="text" name="filename" id="fname" value={{blob.1|safe}}  title="Copy/paste reference model" size="50" /> <!--Contents of the markdown files--> <!--Later on this will be exposed with a button click, next previous, scroll features etc. -->
      
         {% endfor %}
         {% endif %}

        <div id="doc_field_form">
        <table style="width:100%">
        {% for x in created_docs %}
            <tr>
            <th style="width:70%"><input type="button" name="filename" id="fname" value={{x.0|safe}} size="50" /> <!--Name of the markdown files--></th>
            <th><img src="data:image/png;base64,{{x.4}}"></th>
            </tr>
            {% endfor %}
        </table>
        </div>
        <div>
        <table style="width:100%">
            {% for x in shared_docs %}
            <tr>
            <th style="width:70%"><input type="button" name="filename" id="fname" value={{x.0|safe}} size="50" /> <!--Name of the markdown files--></th>
            <th><img src="data:image/png;base64,{{x.4}}"></th>
            </tr>
            {% endfor %}
        </table>
    </div>
    </body>
</html>
