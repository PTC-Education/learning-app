<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <link rel = "stylesheet" href = "{% static 'grader/index.css' %}">
    <style>
        #pdf-container {
            position: fixed;
            top: 70px;
            left: 0px;
            bottom: 10px;
            min-width: 100%;
            background: white;
        }

        #pdf-container iframe {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            height: 100%;
            width: 100%;
        }
        #top-nav{width:100%; padding: 15px 0px 0px 0px;}
        #left-nav{float:left; width: 20%;}
        #right-nav{float:right; width: 20%; text-align: right;}
        #logo-nav{float:left; text-align: center; width: 60%;}
        #logo-nav img{width: 200px;}
    </style>
</head>
<body>
    <div>
        {% if error_message %}
        <p id="err_msg"><strong>{{ error_message }}</strong></p>
        {% endif %}
    </div>

    <div id="top-nav">
        <div id="left-nav">
            <form action="{% url 'grader:index' user.os_user_id %}">
                <input type="hidden" id="index" name="index" value="index">
                <input class = "go_home" type="submit" value="&lt; Back">
            </form>
        </div>

        <div id="logo-nav">
            <img id="app_logo" src="{% static 'grader/images/logo.svg' %}" alt="app_logo" />
        </div>

        <div id="right-nav">
            <form action="{% url 'grader:index' user.os_user_id %}">
                <input type="hidden" id="check" name="check" value="check">
                <input class = "go_home" type="submit" value="Check Model">
            </form>
        </div>
    </div>

    <div id="pdf-container">
        <iframe id="pdf-iframe" width="100%" height="100%" src="{{ pdf_tutorial.string }}" frameborder="0"></iframe>
    </div>
</body>
</html>
