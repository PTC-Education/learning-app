<!DOCTYPE html>
<html lang="en-US">

<head>
    {% load static %}
    <link rel="stylesheet" href="{% static 'grader/index.css' %}">
    <!-- Load loading_index function to enable loading screen -->
    <script src="{% static 'grader/loading.js' %}" type="text/javascript"></script>

</head>

<body>

    <div id="logo">

    <!-- General instructions -->
    <div height="100%">
    <p>PDF Below</p>
    <object data="{{ pdf_tutorial.string }}" type="application/pdf" width="100%" height="100vh"></object>
    </div>

</body>

</html>
