<!DOCTYPE html>
<html lang="en-US">

<head>
    {% load static %}
    <link rel = "stylesheet" href = "{% static 'grader/index.css' %}">
    <link rel = "stylesheet" href = "{% static 'grader/results.css' %}">
    <!-- Load loading_modelling function to enable loading screen -->
    <script src = "{% static 'grader/loading.js' %}" type = "text/javascript"></script>
    <script src = "{% static 'grader/results.js' %}" type = "text/javascript"></script>
    <script src="{% static 'grader/jquery-3.7.1.js' %}" type="text/javascript"></script>

</head>

<body>
    <!-- Load app logo at the top of the page -->
    <div id="logo">
        <img id="app_logo" src="{% static 'grader/images/logo.svg' %}" alt="app_logo" />
    </div>

    <!-- Print out error message if any -->
    <div>
        {% if error_message %}
        <p id="err_msg"><strong>{{ error_message }}</strong></p>
        {% endif %}
    </div>
    
    <form action="{% url 'grader:index' user.os_user_id %}">
        <input type="hidden" id="index" name="index" value="index">
        <input class = "go_home" type="submit" value="Back to regular checker">
    </form>

    <form action="{% url 'grader:index' user.os_user_id %}">
        <input type="hidden" id="check" name="check" value="check">
        <input class = "go_home" type="submit" value="Check Model">
    </form>
    

    <!-- General instructions -->
    <!-- <div id="tutorial"> -->
    <p>PDF Below</p>
    <!-- <object data="{{ pdf_tutorial.string }}" type="application/pdf" height="1000px"><p>Test error message</p></object> -->
    <iframe src="{{ pdf_tutorial.string }}" height="75vh" id="tutorial"><link type="text/css" rel="Stylesheet" href="{% static 'grader/index.css' %}" /></iframe>
    <!-- </div> -->

</body>

</html>
