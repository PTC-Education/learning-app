<!DOCTYPE html>
<html lang="en-US">
    <head>
        {% load static %}
        <link rel="stylesheet" href="{% static 'grader/home.css' %}">
    </head>
    <body>
        {% if user %}
            <!-- Return to the home page -->
            <br />
            <form action="{% url 'grader:index' user.os_user_id %}">
                <input type="submit" value="Return to Home Page"/>
            </form>
            <!-- Go to auto grader -->
            <br />
            <form action="{% url 'grader:grader' user.os_user_id %}">
                <input type="submit" value="Go to Auto Grader"/>
            </form>
        {% else %}
            <!-- Load app logo at the top of the page -->
            <div id="logo">
                <img id="logo" src="{% static 'grader/images/teacherstudents.svg' %}" alt="app_logo"/>
            </div>
        {% endif %}
        <!-- Welcome message and FAQ's -->
        <div>
            <h1 id="details">Detailed Instructions</h1>
            <p>How to use the app.... </p>
        </div>
        {% if user %}
            <!-- Return to the home page -->
            <br />
            <form action="{% url 'grader:index' user.os_user_id %}">
                <input type="submit" value="Return to Home Page"/>
            </form>
        {% else %}
            <!-- Load app logo at the top of the page -->
            <div id="logo">
                <img id="logo" src="{% static 'grader/images/teacherstudents.svg' %}" alt="app_logo"/>
            </div>
        {% endif %}
    </body>
</html>
