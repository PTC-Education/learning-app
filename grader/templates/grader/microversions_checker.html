<!DOCTYPE html>
<html lang="en-US">
    <head>
        {% load static %}
        <link rel="stylesheet" href="{% static 'grader/index.css' %}">
        <!-- Load loading_modelling function to enable loading screen -->
        <script src="{% static 'grader/loading.js' %}" type="text/javascript"></script>
        <script src="{% static 'grader/jquery-3.7.1.js' %}" type="text/javascript"></script>
        <script>
            $(document).ready(function () {
                // Attach a submit event handler to the form
                $("#update_form").submit(function (event) {
                    loading_spinner('features');
                    console.log("loading first batch");
                    // Prevent the default form submission behavior
                    event.preventDefault();
                    var url = "{% url 'grader:update_html' user.os_user_id 'w' ' ' %}";
                    $.ajax({
                        url: url,
                        type: "GET",
                        success: function (data) {
                            $('#results-container').append(data.updated_html);
                            $('#load-more-container').css('display', 'block');
                            $('#wmid').val(data.next_microversion);
                            $('#features').html(" ");
                        },
                        error: function (error) {
                            console.log("Error:", error);
                        }
                    });
                });
                $("#load_more").submit(function (event) {
                    loading_spinner('features');
                    var newYpos = $('#load-more-container').offset().top;
                    console.log(newYpos);
                    $('#features').css('position', 'absolute');
                    $('#features').css('top', newYpos + 'px');
                    console.log("loading second batch");
                    var wmidVal = $('#wmid').val();
                    // Prevent the default form submission behavior
                    event.preventDefault();
                    var url = "{% url 'grader:update_html' user.os_user_id 'w' ' ' %}";
                    var url = "{% url 'grader:update_html' user.os_user_id 'm' 'wmid' %}".replace('wmid', wmidVal);
                    $.ajax({
                        url: url,
                        type: "GET",
                        success: function (data) {
                            $('#results-container').append(data.updated_html);
                            $('#wmid').val(data.next_microversion);
                            $('#features').html(" ");
                        },
                        error: function (error) {
                            console.log("Error:", error);
                        }
                    });
                });
            });
            function hide()
            {
                document.getElementById('load-more-container').style.display = "none";
            }
            window.onload = hide;
        </script>
    </head>
    <body>
        <form action="{% url 'grader:index' user.os_user_id %}">
            <input type="submit" value="Return to Home Page"/>
        </form>
        <!-- Check model -->
        <form method="get" id="update_form">
            <input type="hidden" id="wm" value="w">
            <input type="submit" value="Get Microversions">
        </form>
        <div class="spinner-container">
            <div id="features">
                <!--This is where the spinner will load-->
            </div>
        </div>
        <div id="results-container"></div>
        <div class="spinner-container">
            <div id="features">
                <!--This is where the spinner will load-->
            </div>
        </div>
        <div id="load-more-container">
            <form method="get" id="load_more">
                <input type="hidden" id="wm" value="m">
                <input type="hidden" id="wmid" value=" ">
                <input type="submit" value="Load More">
            </form>
        </div>
    </body>
</html>
