<!DOCTYPE html>
<html lang="en-US">

<head>
    {% load static %}
    <link rel="stylesheet" href="{% static 'grader/index.css' %}">
    <!-- Load loading_index function to enable loading screen -->
    <script src="{% static 'grader/loading.js' %}" type="text/javascript"></script>
    <meta http-equiv = "refresh" content = "0; URL={% url 'grader:doc_info_checker' user.os_user_id %}" />
</head>

<body>
    <!-- Load app logo at the top of the page -->
    <div id="logo">
        <img id="app_logo" src="{% static 'grader/images/teacherstudents.svg' %}" alt="app_logo" onload="loading_spinner('spinner')"/>
    </div>
    <div class="spinner-container">
        <div id="spinner">
            <!--This is where the spinner will load-->
        </div>
    </div>

</body>

</html>
