<!DOCTYPE html>
<html lang="en-US">
    <head>
        {% load static %}
        <link rel="stylesheet" href="{% static 'grader/index.css' %}">
        <!-- Load loading_index function to enable loading screen -->
        <script src="{% static 'grader/loading.js' %}" type="text/javascript
        "></script>
    </head>
    <body>
        <!-- Load app logo at the top of the page -->
        <div id="logo">
            <img id="app_logo" src="{% static 'grader/images/teacherstudents.svg' %}" alt="app_logo" width="95%"/>
        </div>
        <!-- Print out error message if any -->
        <div>
            {% if error_message %}
                <p id="err_msg"><strong>{{ error_message }}</strong></p>
            {% endif %}
        </div>
        <!-- General instructions -->
        <div>
            <h3>Instructions:</h3>
            <p>Auto grader instrucitons here.</p>
            <!-- Go to auto grader -->
            <br />
            <form action="{% url 'grader:grader' user.os_user_id %}">
                <input type="submit" value="Go to Auto Grader"/>
            </form>
            <br>
            <p class="details">For more information, view the <a href="{% url 'grader:home' user.os_user_id %}#details">detailed instructions</a>.</p>
        </div>
        <br /><br />
        <!-- Disclaimer -->
        <div>
            <a href="{% url 'grader:home' user.os_user_id %}#details">Detailed Instructions</a> | <a href="https://docs.google.com/forms/d/e/1FAIpQLSeOcFJo3V05CMtQSAXmmiF22xdfsdaob7_tBCTCDEwZVdVRwA/viewform?usp=sf_link">Feedback</a></p>
        </div>
        <!-- Enable hide-and-show for accordions -->
        <script src="{% static 'grader/accordion.js' %}" type="text/javascript"></script>
    </body>
</html>
